<!DOCTYPE html>
<html>
<head>
  <title>Skilio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      color: white;
    }

    /* LANDING */
    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-size: 50px;
      color: #7c3aed;
    }

    p {
      opacity: 0.8;
      font-size: 18px;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 20px;
      background: #7c3aed;
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* CHAT PAGE */
    #chatPage {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .chatBox {
      flex: 1;
      padding: 20px;
    }

    #chat {
      height: 70vh;
      overflow-y: auto;
      background: #111827;
      padding: 10px;
      border-radius: 10px;
    }

    .msg { margin: 8px 0; }
    .user { color: #60a5fa; }
    .ai { color: #a78bfa; }

    .input {
      display: flex;
      margin-top: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-left: 8px;
      padding: 12px;
      background: #7c3aed;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- LANDING PAGE -->
<div id="landing">
  <div class="hero">
    <h1>Skilio 🚀</h1>
    <p>Your AI Study & Career Copilot</p>
    <button class="btn" onclick="start()">Start Learning</button>
  </div>
</div>

<!-- CHAT PAGE -->
<div id="chatPage">

  <div class="chatBox">
    <div id="chat"></div>

    <div class="input">
      <input id="input" placeholder="Ask Skilio..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>
function start() {
  document.getElementById("landing").style.display = "none";
  document.getElementById("chatPage").style.display = "flex";
}

async function send() {
  let text = document.getElementById("input").value;
  let chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="msg user">You: ${text}</div>`;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  chat.innerHTML += `<div class="msg ai">Skilio: ${data.reply}</div>`;
}
</script>

</body>
</html>
