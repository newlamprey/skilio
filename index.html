<!DOCTYPE html>
<html>
<head>
  <title>Skilio AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --panel2: #0f172a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #7c3aed;
      --accent: #22d3ee;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: var(--panel);
      transform: translateX(-100%);
      transition: 0.25s ease;
      padding: 15px;
      border-right: 1px solid rgba(255,255,255,0.05);
      z-index: 1000;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar h2 {
      color: var(--primary);
      margin-bottom: 20px;
    }

    .chat-item {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      font-size: 14px;
    }

    .chat-item:hover {
      background: rgba(124,58,237,0.2);
    }

    /* ===== TOP BAR ===== */
    .topbar {
      height: 60px;
      background: var(--panel);
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .menu {
      font-size: 22px;
      cursor: pointer;
      margin-right: 15px;
      user-select: none;
    }

    .title {
      font-weight: 700;
      color: #c4b5fd;
    }

    /* ===== MAIN CHAT ===== */
    .main {
      margin-left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: 0.25s ease;
    }

    .main.shift {
      margin-left: 260px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 12px;
      border-radius: 12px;
      max-width: 70%;
      animation: fadeIn 0.2s ease;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: rgba(124,58,237,0.2);
      color: #a78bfa;
    }

    .ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      color: #e5e7eb;
    }

    /* ===== INPUT ===== */
    .input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: var(--panel);
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: var(--panel2);
      color: white;
    }

    button {
      margin-left: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    /* ===== ANIMATION ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== BACKDROP ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2>Skilio</h2>

  <div class="chat-item">➕ New Chat</div>
  <div class="chat-item">📚 Study Session</div>
  <div class="chat-item">🧠 Exam Prep</div>
  <div class="chat-item">🚀 Career Mode</div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div class="main" id="main">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="menu" onclick="toggleSidebar()">☰</div>
    <div class="title">Skilio AI</div>
  </div>

  <!-- CHAT -->
  <div id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input id="input" placeholder="Ask Skilio anything..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
  document.getElementById("main").classList.toggle("shift");
}

async function send() {
  let text = document.getElementById("input").value;
  let chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  document.getElementById("input").value = "";

  let id = "msg" + Date.now();
  chat.innerHTML += `<div class="msg ai" id="${id}">Thinking...</div>`;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  document.getElementById(id).innerHTML = data.reply;
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
