<!DOCTYPE html>
<html>
<head>
  <title>Skilio AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .app {
      width: 100%;
      max-width: 650px;
      background: #111827;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: #7c3aed;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      background: #0b0f1a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .msg {
      margin: 8px 0;
    }

    .user { color: #60a5fa; }
    .ai { color: #a78bfa; }

    .input-area {
      display: flex;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>Skilio AI 🚀</h1>

  <div id="chat"></div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask anything..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
async function send() {
  let text = document.getElementById("userInput").value;
  let chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="msg user">You: ${text}</div>`;
  document.getElementById("userInput").value = "";

  chat.innerHTML += `<div class="msg ai">Skilio: thinking...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    chat.innerHTML += `<div class="msg ai">Skilio: ${data.reply}</div>`;
  } catch (err) {
    chat.innerHTML += `<div class="msg ai">Skilio: error connecting to server</div>`;
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
