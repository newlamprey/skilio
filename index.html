<!DOCTYPE html>
<html>
<head>
  <title>Skilio AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      background: #111827;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: #7c3aed;
      margin-bottom: 20px;
    }

    #chat {
      height: 300px;
      overflow-y: auto;
      background: #0b0f1a;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .msg {
      margin: 10px 0;
    }

    .user {
      color: #60a5fa;
    }

    .ai {
      color: #a78bfa;
    }

    .input-area {
      display: flex;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>Skilio AI 🚀</h1>

  <div id="chat"></div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask Skilio..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
async function send() {
  let text = document.getElementById("userInput").value;
  let chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="msg user">You: ${text}</div>`;

  document.getElementById("userInput").value = "";

  chat.innerHTML += `<div class="msg ai">Skilio: thinking...</div>`;
  chat.scrollTop = chat.scrollHeight;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  chat.innerHTML += `<div class="msg ai">Skilio: ${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
