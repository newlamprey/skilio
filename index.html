<!DOCTYPE html>
<html>
<head>
  <title>Skilio AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: #111827;
      padding: 15px;
    }

    .sidebar h2 {
      color: #7c3aed;
    }

    .chat-list {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin: 8px 0;
    }

    .user { color: #60a5fa; }
    .ai { color: #a78bfa; }

    .input-area {
      display: flex;
      margin-top: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-left: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }

    h1 {
      color: #7c3aed;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Skilio</h2>
  <div class="chat-list">
    • New Chat<br>
    • Study Session<br>
    • Exam Prep
  </div>
</div>

<div class="main">

  <h1>Skilio AI 🚀</h1>

  <div id="chat"></div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask Skilio..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
async function send() {
  let text = document.getElementById("userInput").value;
  let chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="msg user">You: ${text}</div>`;
  document.getElementById("userInput").value = "";

  chat.innerHTML += `<div class="msg ai">Skilio: thinking...</div>`;
  chat.scrollTop = chat.scrollHeight;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  chat.innerHTML += `<div class="msg ai">Skilio: ${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
