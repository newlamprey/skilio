<!DOCTYPE html>
<html>
<head>
  <title>Skilio AI</title>

  <style>
    body {
      background: #0b0f1a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 70px;
    }

    h1 {
      color: #7c3aed;
      font-size: 40px;
    }

    input {
      padding: 12px;
      width: 280px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 16px;
      margin-left: 6px;
      border: none;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }

    #output {
      margin-top: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<h1>Skilio AI 🚀</h1>

<input id="userInput" placeholder="Ask Skilio..." />
<button onclick="askAI()">Send</button>

<div id="output"></div>

<script>
async function askAI() {
  let text = document.getElementById("userInput").value;
  let output = document.getElementById("output");

  if (!text) return;

  output.innerHTML = "Thinking... 🤔";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  output.innerHTML = data.reply;
}
</script>

</body>
</html>
